<!DOCTYPE html><html><head><meta name=viewport content='width=device-width,initial-scale=1'><title>LA JAULA</title><style>body{background:#0a0a12;color:#fff;text-align:center;font-family:sans-serif;padding:20px}button{background:#ff2a2a;border:0;color:#fff;padding:15px;border-radius:10px;width:90%;margin:8px;font-size:18px}input{padding:12px;border-radius:8px;border:0;width:80%;margin:5px;text-align:center}#tap{height:200px;font-size:40px;display:none}</style></head><body><h1>🔥 LA JAULA 🔥</h1><div id=login><input id=name placeholder='Tu apodo'><button onclick=entrar()>ENTRAR 1000 MONEDAS</button><p id=coins></p></div><div id=lobby style=display:none><input id=bet type=number value=100 min=100><button onclick=crear()>CREAR JAULA (100 a infinito)</button></div><div id=arena style=display:none><h2 id=vs></h2><h1 id=score>0-0</h1><button id=tap ontouchstart=tap() onclick=tap()>TAP!!!</button><h2 id=win></h2></div><script>let user,ws;async function entrar(){user=name.value;let r=await fetch(`/user/${user}`);let d=await r.json();coins.innerText=`Saldo: ${d.coins}`;login.style.display='none';lobby.style.display='block'}async function crear(){let b=document.getElementById('bet').value;let r=await fetch(`/create/${user}/${b}`,{method:'POST'});let d=await r.json();if(d.error){alert(d.error);return}unirse(d.room_id)}function unirse(id){lobby.style.display='none';arena.style.display='block';tap.style.display='block';vs.innerText=`JAULA #${id}`;let p=location.protocol=='https:'?'wss:':'ws:';ws=new WebSocket(`${p}//${location.host}/ws/${id}/${user}`);ws.onmessage=e=>{let data=JSON.parse(e.data);let pl=data.players;let t=data.taps;if(pl.length==2)score.innerText=`${t[pl[0]]}-${t[pl[1]]}`;if(data.winner){win.innerText=`GANADOR: ${data.winner}`;tap.style.display='none';setTimeout(()=>location.reload(),3000)}} }function tap(){ws.send('t')}</script></body></html>
